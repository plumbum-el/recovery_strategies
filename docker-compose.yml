services:

  postgres:
    container_name: recovery_strategies_postgres
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: recovery_strategies_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    container_name: recovery_strategies_adminer
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  redis:
    container_name: recovery_strategies_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres-data:
  redis-data:
